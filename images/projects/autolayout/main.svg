<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Dark Modern Background (Tailwind Slate-900) -->
  <rect width="800" height="500" fill="#0F172A" rx="16" />
  
  <!-- Subtle Grid Background to represent engineering/EDA -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#334155" />
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" rx="16" />

  <!-- LEFT SIDE: Schematic Input (Cyan) -->
  <g stroke="#38BDF8" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Wire -->
    <path d="M 80 250 L 160 250" />
    <path d="M 160 250 L 160 160 L 220 160" />
    <!-- Resistor Symbol -->
    <path d="M 220 160 L 230 140 L 250 180 L 270 140 L 290 180 L 300 160 L 320 160" />
    <!-- Wire down to Ground -->
    <path d="M 160 250 L 160 340 L 260 340" />
    <path d="M 260 325 L 260 355" />
    <path d="M 270 330 L 270 350" />
    <path d="M 280 335 L 280 345" />
    <!-- Schematic Nodes -->
    <circle cx="160" cy="250" r="6" fill="#38BDF8" />
    <circle cx="80" cy="250" r="6" fill="#38BDF8" />
  </g>
  <text x="180" y="420" fill="#38BDF8" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="2">SCHEMATIC</text>

  <!-- CENTER: Vision-Language Model Concept (Purple/Pink Glow) -->
  <g transform="translate(400, 250)">
    <!-- AI Core Glowing circle -->
    <circle cx="0" cy="0" r="45" fill="#1E1B4B" stroke="#A855F7" stroke-width="4" />
    <!-- Vision / Eye / Sparkle abstraction -->
    <path d="M -20 0 Q 0 -25 20 0 Q 0 25 -20 0 Z" fill="#A855F7" opacity="0.8" />
    <circle cx="0" cy="0" r="8" fill="#E879F9" />
    <!-- Neural Network Nodes connecting in and out -->
    <line x1="-70" y1="0" x2="-45" y2="0" stroke="#A855F7" stroke-width="4" stroke-dasharray="6 6" />
    <line x1="45" y1="0" x2="70" y2="0" stroke="#A855F7" stroke-width="4" stroke-dasharray="6 6" />
  </g>
  <text x="365" y="340" fill="#E879F9" font-family="sans-serif" font-size="18" font-weight="bold">VLM</text>

  <!-- RIGHT SIDE: Physical PCB Layout Output (Green/Gold) -->
  <g transform="translate(600, 250)">
    <!-- SOIC-8 IC Body -->
    <rect x="-30" y="-35" width="60" height="70" fill="#111827" stroke="#FBBF24" stroke-width="3" rx="4" />
    <circle cx="-15" cy="-20" r="4" fill="#FBBF24" /> <!-- Pin 1 Indicator -->
    
    <!-- Copper Pads (Left side) -->
    <rect x="-45" y="-25" width="15" height="8" fill="#10B981" rx="2" />
    <rect x="-45" y="-10" width="15" height="8" fill="#10B981" rx="2" />
    <rect x="-45" y="5" width="15" height="8" fill="#10B981" rx="2" />
    <rect x="-45" y="20" width="15" height="8" fill="#10B981" rx="2" />
    
    <!-- Copper Pads (Right side) -->
    <rect x="30" y="-25" width="15" height="8" fill="#10B981" rx="2" />
    <rect x="30" y="-10" width="15" height="8" fill="#10B981" rx="2" />
    <rect x="30" y="5" width="15" height="8" fill="#10B981" rx="2" />
    <rect x="30" y="20" width="15" height="8" fill="#10B981" rx="2" />
  </g>

  <!-- Routed Traces (Green) -->
  <g stroke="#10B981" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trace leaving Pin 1 -->
    <path d="M 555 225 L 515 225 L 485 195 L 485 160 L 530 160" />
    <!-- Trace leaving Pin 8 -->
    <path d="M 645 225 L 680 225 L 720 265 L 720 310" />
    <!-- Vias -->
    <circle cx="530" cy="160" r="6" fill="#0F172A" stroke="#10B981" stroke-width="4" />
    <circle cx="720" cy="310" r="6" fill="#0F172A" stroke="#10B981" stroke-width="4" />
  </g>
  <text x="590" y="420" fill="#10B981" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="2">PCB LAYOUT</text>
</svg>
